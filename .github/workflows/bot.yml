name: 24/7 Ruijie Bot Workflow

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'  # ၅ နာရီတစ်ကြိမ် အလိုအလျောက် စတင်ရန်
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Script
        run: |
          python bot.py
